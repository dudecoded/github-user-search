<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>guthub-search</title>
   <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css" />
</head>
<body>
    <header>
        <div class="headimg">
             <img src="./assest/logo.png">
        </div>
        <div class="heading">
        <h1>Github User Finder</h1>
        <h4>Search Github Profiles With Ease!</h4>
        </div>
    </header>

    <main>
        <div class="nav">
            <img src="./assest/images.png"/>
           <P>search github user</P> 
        </div>
            <search class="github-search">
            <form id="github-form">
                <input 
                type="search" 
                id="github-username" 
                name="username" 
                placeholder="Enter GitHub username" 
                required>
                <button type="submit">Search</button>
            </form>
        </search>

        <section class="profile-card">

    <img 
        id="profile-image" 
        src="./assest/images.png" 
        alt="GitHub Profile"
    >

    <h2 id="profile-username">Username</h2>

    <p id="profile-name">Name</p>

    <p id="profile-bio">
        User bio will appear here...
    </p>

    <div class="stats">

        <div class="stat">
            <h3 id="repo-count">0</h3>
            <p>Repositories</p>
        </div>

        <div class="stat">
            <h3 id="follower-count">0</h3>
            <p>Followers</p>
        </div>

        <div class="stat">
            <h3 id="following-count">0</h3>
            <p>Following</p>
        </div>

    </div>

    <a id="github-link" href="#" target="_blank">
        View GitHub Profile
    </a>

</section>
    </main>
    <script src="script.js"></script>
</body>
</html>
